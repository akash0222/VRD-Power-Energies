<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>VRD Power Energies | Admin</title><link rel="stylesheet" href="/admin.css"></head>
<body><main class="shell"><header><div class="mark">VRD</div><div><h1>Enquiry dashboard</h1><p>VRD Power Energies · Internal use</p></div></header>
<section id="loginPanel" class="panel"><h2>Admin sign in</h2><p>Sign in to view and manage customer enquiries.</p><form id="loginForm"><label>Admin email<input name="email" type="email" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button>Sign in</button><p id="loginStatus" class="status" role="status"></p></form></section>
<section id="dashboard" hidden><div class="toolbar"><div><h2>Customer enquiries</h2><p id="summary">Loading enquiries…</p></div><button id="logout" class="secondary">Sign out</button></div><div class="filters"><input id="search" placeholder="Search name, company or email"><select id="statusFilter"><option value="">All statuses</option><option>New</option><option>Contacted</option><option>Quoted</option><option>Closed</option></select></div><div id="enquiries" class="enquiries"></div><p id="dashStatus" class="status" role="status"></p></section>
<footer>Keep admin credentials private. Configure server environment variables before deployment.</footer></main><script src="/admin.js"></script></body></html>
